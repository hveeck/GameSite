:17px}input,textarea{display:block;background:#0f202e;border:1px solid #476070;color:var(--text);padding:13px 14px;border-radius:8px;width:100%;margin-top:8px;outline:0}input:focus,textarea:focus{border-color:var(--gold)}.small{font-size:12px}.muted{color:var(--muted)}.primary,.secondary,.danger,.ghost{border:0;border-radius:8px;padding:13px 17px;font-weight:700}.primary{background:var(--red);color:#15212a}.secondary{background:#39566a;color:#fff}.danger{background:#66322f;color:#fff}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.wide{width:100%}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.topline h1{font-size:43px;margin:7px 0 23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 23px}.stats>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center;padding:18px 10px}.stats strong{display:block;font:600 36px Oswald;color:var(--gold)}.stats span{color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:700}nav{display:flex;gap:7px;overflow-x:auto;margin-bottom:23px;border-bottom:1px solid var(--line)}nav button{color:var(--muted);border:0;background:none;padding:13px 15px;white-space:nowrap;font-weight:700}nav button.active{color:var(--text);box-shadow:inset 0 -3px var(--red)}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.card{padding:23px;margin-bottom:16px}.card h2{font-size:27px;margin:6px 0 15px}.card h3{font-size:19px;margin:0 0 10px}.target{font:500 44px Oswald;text-transform:uppercase;color:var(--gold);margin:14px 0}.status{display:inline-block;border-radius:20px;font-size:11px;font-weight:700;padding:5px 10px;background:#345348;color:#b5ecd3}.status.dead{background:#5d383c;color:#ffb6a9}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border:0}.itemhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.itemhead strong{font-size:15px}.item p{margin:7px 0 0;color:v <header><div class="brand"><span class="mark">✦</span><span>SENIOR <b>ASSASSIN</b><small>THE CLOTHESPIN HUNT</small></span></div><span id="phaseBadge" class="badge">REGISTRATION</span></header>
<main>

</main><div id="toast" aria-live="polite"></div><script>
window.SA_CONFIG = {
  endpoint: 'https://joqypdrkojtinlflbvur.supabase.co/functions/v1/senior-assassin'
};

</script><script>
const $=id=>document.getElementById(id);
const tokenKey='senior-assassin-session';
let token=localStorage.getItem(tokenKey)||'',mode='login',view='dashboard',state=null,loading=false;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString():'—';
const remaining=s=>!s?'':Math.max(0,Math.ceil((new Date(s)-Date.now())/1000));
const toast=s=>{$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4400)};
async function api(action,body={}){
  const response=await fetch(window.SA_CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...body})});
  const result=await response.json();if(!response.ok||result.error)throw Error(result.error||'Request failed');return result;
}
async function refresh(){
  try {state=await api('state');showApp();render()}catch(e){if(String(e.message).includes('log in'))logout(false);else toast(e.message)}
}
function logout(remote=true){if(remote&&token)api('logout').catch(()=>{});token='';localStorage.removeItem(tokenKey);state=null;$('appView').hidden=true;$('authView').hidden=false}
function setMode(m){mode=m;for(const x of ['login','register','admin'])$(x+'Tab').classList.toggle('active',x===m);$('nameLabel').hidden=m==='admin';$('authName').required=m!=='admin';$('inviteLabel').hidden=m!=='register';$('authInvite').required=m==='register';$('authSubmit').textContent=m==='register'?'Create account →':m==='admin'?'Enter command center →':'Enter the hunt →';$('authHint').textContent=m==='register'?'Choose a throwaway password you do not use on any other site. The game master can help recover it.':m==='admin'?'Enter your separate game-master password.':'Use your full name and password.'}
['login','register','admin'].forEach(m=>$(m+'Tab').onclick=()=>setMode(m));
$('authForm').onsubmit=async e=>{e.preventDefault();if(loading)return;loading=true;$('authSubmit').disabled=true;try{const data=await api(mode==='register'?'register':mode==='admin'?'admin_login':'login',{name:$('authName').value,password:$('authPassword').value,invite:$('authInvite').value});token=data.token;localStorage.setItem(tokenKey,token);$('authPassword').value='';await refresh()}catch(err){toast(err.message)}finally{loading=false;$('authSubmit').disabled=false}};
$('logout').onclick=()=>logout();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
function showApp(){$('authView').hidden=true;$('appView').hidden=false}
function render(){
  if(!state)return;
  $('phaseBadge').textContent=state.phase.toUpperCase();$('welcome').textContent=state.me?'Welcome, '+state.me.name.split(' ')[0]:'Command center';
  const alive=state.players.filter(p=>p.alive).length;$('aliveCount').textContent=alive;$('outCount').textContent=state.players.length-alive;$('killCount').textContent=state.me?.kills??'—';
  $('adminNav').hidden=!state.admin_players;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const renderers={dashboard,feed,players:leaderboard,rules,admin};$('content').innerHTML=(renderers[view]||dashboard)();bind();
}
function dashboard(){const me=state.me,alive=state.players.filter(p=>p.alive).length;
  if(!me)return `<div class="card"><h2>Game master</h2><p>Manage registrations, launch the game, and review elimination claims from your command center.</p><button class="primary" data-goto="admin">Open command center →</button></div>`;
  return `<div class="grid"><div><section class="card"><span class="eyebrow">YOUR SECRET ASSIGNMENT</span>${state.phase==='registration'?`<h2>Awaiting deployment</h2><p class="muted">The game master will assign targets when everyone has joined.</p>`:!me.alive?`<h2 class="red">Eliminated</h2><p>You can still follow the hunt and enjoy the feed.</p>`:state.phase==='finished'?`<h2>Hunt complete</h2><p>Winner: ${escapeHtml(state.winner)}</p>`:`<div class="target">${escapeHtml(me.target||'No target')}</div><span class="status">TARGET ACTIVE</span><p class="muted">Secretly attach a wooden clothespin. If caught, you have 30 seconds to finish the attempt.</p>${remaining(me.cooldown_until)?`<div class="notice">Cooldown: ${Math.ceil(remaining(me.cooldown_until)/60)} minutes remaining.</div>`:''}${remaining(me.shield_until)?`<div class="notice">You are protected for ${Math.ceil(remaining(me.shield_until)/60)} more minutes.</div>`:''}<div class="actions"><button class="primary" data-action="claim" ${state.phase!=='live'||remaining(me.cooldown_until)?'disabled':''}>Submit elimination</button><button class="secondary" data-action="timer">30-sec timer</button></div>`}</section>
    ${state.phase==='live'&&me.alive?`<section class="card"><h2>Defense station</h2><p class="muted">Caught your assassin but escaped the 30-second pursuit? Report the failed attempt to start their 30-minute cooldown.</p><div class="actions"><button class="secondary" data-action="failed">Report failed attempt</button><button class="ghost" data-action="accuse" ${me.last_accusation_date===new Date().toISOString().slice(0,10)?'disabled':''}>Make daily accusation</button></div></section>`:''}</div><div><section class="card"><h2>Hunt status</h2><div class="row"><span>Players remaining</span><b class="gold">${alive} / ${state.players.length}</b></div><div class="row" style="margin-top:13px"><span>Game status</span><span class="status">${escapeHtml(state.phase.toUpperCase())}</span></div>${state.winner?`<div class="notice">Last survivor: ${escapeHtml(state.winner)}</div>`:''}</section><section class="card"><h2>Latest activity</h2>${state.events.slice(0,5).map(e=>`<div class="item"><strong>${escapeHtml(e.description)}</strong><p class="small">${date(e.created_at)}</p></div>`).join('')||'<div class="empty">Quiet... for now.</div>'}</section></div></div>`;
}
function feed(){return `<section class="card"><span class="eyebrow">THE HUNT ARCHIVE</span><h2>Elimination feed</h2>${state.eliminations.length?state.eliminations.map(e=>`<article class="item"><div class="itemhead"><strong>${escapeHtml(e.assassin)} → ${escapeHtml(e.victim)}</strong><span class="pill">${escapeHtml(e.status)}</span></div><p class="small">${date(e.submitted_at)}</p>${e.caption?`<p>${escapeHtml(e.caption)}</p>`:''}${e.photo_url?`<img src="${escapeHtml(e.photo_url)}" alt="Submitted elimination evidence" loading="lazy">`:''}${state.me?.id===e.victim_id&&['pending','disputed'].includes(e.status)?`<div class="actions"><button class="primary" data-resolve="${e.id}" data-approve="true">Confirm elimination</button><button class="danger" data-resolve="${e.id}" data-approve="false">Dispute</button></div>`:''}</article>`).join(''):'<div class="empty">No eliminations yet. Be the first.</div>'}</section>`}
function leaderboard(){return `<section class="card"><span class="eyebrow">THE COMPETITION</span><h2>Leaderboard</h2>${[...state.players].sort((a,b)=>Number(b.alive)-Number(a.alive)||b.kills-a.kills||a.name.localeCompare(b.name)).map((p,i)=>`<div class="item row"><div><span class="gold">#${i+1}</span> &nbsp; <strong>${escapeHtml(p.name)}</strong><p class="small">${p.kills} elimination${p.kills===1?'':'s'}</p></div><span class="status ${p.alive?'':'dead'}">${p.alive?'ALIVE':'OUT'}</span></div>`).join('')}</section>`}
function rules(){return `<section class="card"><span class="eyebrow">OFFICIAL RULES</span><h2>Rules of the hunt</h2>${[
  ['The mission','Each player receives exactly one secret target. Never share someone else’s assignment.'],
  ['The elimination','Secretly attach a normal clothespin to your target’s outer clothing or bag. Avoid skin, hair, and private areas.'],
  ['Caught in the act','If your target catches you before you complete the stealth elimination, you have 30 seconds to attempt a tag. No grabbing, blocking, tackling, or physical restraint.'],
  ['Cooldown','If the attempt fails, you must wait 30 minutes before trying again. The target reports the failed attempt.'],
  ['Proof and confirmation','Submit a picture if available and a short description. The target confirms or disputes. Disputes go to the game master.'],
  ['Inheritance','After a confirmed elimination, you automatically inherit the eliminated player’s target.'],
  ['Accusations','Once per day, you can identify who you think is hunting you. A correct guess provides 24-hour protection; a wrong guess uses the accusation.'],
  ['Safe zones','No attempts in classrooms during class, bathrooms, religious services, work shifts, while driving, or in private spaces without permission. No running through roads, staircases, or crowded areas.'],
  ['Consent and common sense','Everyone can decline an interaction or stop an attempt. Respect campus policies and bystanders. Do not pursue anyone who asks you to stop.'],
  ['Victory','The last living player wins. Most eliminations earns a separate title.']].map(([h,p])=>`<div class="rule"><b>${h}</b><p>${p}</p></div>`).join('')}</section>`}
function admin(){if(!state.admin_players)return dashboard();return `<div class="grid"><div><section class="card"><span class="eyebrow">GAME CONTROL</span><h2>Command center</h2><p class="muted">Phase: ${escapeHtml(state.phase)}</p><label>Registration invitation code<input id="inviteCode" placeholder="At least 6 characters"></label><button class="secondary" data-action="invite" ${state.phase!=='registration'?'disabled':''}>Save invite code</button><div class="actions"><button class="primary" data-action="start" ${state.phase!=='registration'?'disabled':''}>Start game</button><button class="secondary" data-action="${state.phase==='paused'?'resume':'pause'}" ${!['live','paused'].includes(state.phase)?'disabled':''}>${state.phase==='paused'?'Resume':'Pause'}</button><button class="danger" data-action="finish" ${state.phase==='finished'?'disabled':''}>End game</button></div></section><section class="card"><h2>Pending claims</h2>${state.pending.length?state.pending.map(e=>`<div class="item"><strong>${escapeHtml(e.assassin)} → ${escapeHtml(e.victim)}</strong><p>${escapeHtml(e.caption)} · ${escapeHtml(e.status)}</p>${e.photo_url?`<img src="${escapeHtml(e.photo_url)}" alt="Evidence">`:''}<div class="actions"><button class="primary" data-resolve="${e.id}" data-approve="true">Approve</button><button class="danger" data-resolve="${e.id}" data-approve="false">Reject</button></div></div>`).join(''):'<p class="muted">No pending claims.</p>'}</section></div><div><section class="card"><h2>Player accounts</h2><p class="muted small">You can export the requested password list to a private text file. Never upload it to GitHub.</p><button class="secondary wide" data-action="export">Download password list .txt</button>${state.admin_players.map(p=>`<div class="item"><strong>${escapeHtml(p.name)}</strong><p class="small">${p.alive?'Alive':'Out'} · Target: ${escapeHtml(p.target||'—')} · Kills: ${p.kills}</p><div class="actions"><button class="ghost" data-reset="${p.id}">Reset password</button><button class="ghost" data-cooldown="${p.id}" ${!p.alive?'disabled':''}>Cooldown</button><button class="danger" data-eliminate="${p.id}" ${!p.alive?'disabled':''}>Remove</button></div></div>`).join('')}</section></div></div>`}
function bind(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{view=b.dataset.goto;render()});
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>doAction(b.dataset.action));
  document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>perform('resolve',{id:b.dataset.resolve,approve:b.dataset.approve==='true'},'Claim updated'));
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const pass=prompt('New temporary password (at least 8 characters):');if(pass)await perform('reset_password',{player_id:b.dataset.reset,password:pass},'Password reset')});
  document.querySelectorAll('[data-cooldown]').forEach(b=>b.onclick=()=>perform('admin_cooldown',{player_id:b.dataset.cooldown},'Cooldown added'));
  document.querySelectorAll('[data-eliminate]').forEach(b=>b.onclick=()=>{if(confirm('Remove this player from the game?'))perform('admin_eliminate',{player_id:b.dataset.eliminate},'Player removed')});
}
async function perform(action,payload,message){try{const out=await api(action,payload);toast(out.message||message||'Done');await refresh()}catch(e){toast(e.message)}}
async function doAction(action){
  if(action==='claim'){
    const photo=document.createElement('input');photo.type='file';photo.accept='image/jpeg,image/png,image/webp';photo.capture='environment';
    const caption=prompt('Describe the elimination (optional):');if(caption===null)return;
    photo.onchange=async()=>{const f=photo.files?.[0];if(f&&f.size>5*1024*1024)return toast('Photo must be under 5 MB');let encoded=null;if(f)encoded=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});await perform('submit',{caption,photo:encoded},'Submitted')};
    if(confirm('Attach a photo? Choose Cancel to submit your description without a photo.'))photo.click();else await perform('submit',{caption},'Submitted');return;
  }
  if(action==='timer'){let left=30;const b=document.querySelector('[data-action="timer"]');if(!b)return;b.disabled=true;b.textContent='30 seconds';const t=setInterval(()=>{left--;b.textContent=`${left} seconds`;if(left<=0){clearInterval(t);b.textContent='Time expired';setTimeout(()=>{b.textContent='30-sec timer';b.disabled=false},2000)}},1000);return}
  if(action==='failed'&&!confirm('Did your assassin fail to attach a clothespin within the 30-second period?'))return;
  if(action==='failed')return perform('failed_attempt',{},'30-minute cooldown started');
  if(action==='accuse'){const choices=state.players.filter(p=>p.alive&&p.id!==state.me?.id);const name=prompt('Who is your assassin? Enter their exact full name:\n'+choices.map(p=>p.name).join('\n'));if(!name)return;const found=choices.find(p=>p.name.toLowerCase()===name.toLowerCase().trim());if(!found)return toast('Name not found');return perform('accuse',{accused_id:found.id},'Accusation recorded')}
  if(action==='invite')return perform('set_invite',{invite:$('inviteCode').value},'Invite code saved');
  if(action==='export'){const lines=['SENIOR ASSASSIN — PRIVATE PASSWORD LIST','Do not share this file or upload it to GitHub.','',...state.admin_players.map(p=>`${p.name} | ${p.password}`)];const blob=new Blob([lines.join('\n')],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='senior-assassin-private-passwords.txt';a.click();URL.revokeObjectURL(url);return}
  if(action==='start'&&!confirm('Start the game and secretly assign targets to every registered player?'))return;
  if(action==='finish'&&!confirm('End the game now?'))return;
  return perform(action,{},'Game updated');
}
if(token)refresh();else setMode('login');
setInterval(()=>{if(token&&state)refresh()},30000);

</script></body></html>
